<script>
    var codigo = parseInt(prompt("Digite o código do produto:"));

    switch(codigo){
        case 1:
            alert("Cachorro quente - R$ 8,00");
            break;

        case 2:
            alert("Cheeseburger - R$ 12,00");
            break;

        case 3:
            alert("X-Salada - R$ 15,00");
            break;

        case 4:
            alert("Misto Quente - R$ 11,00");
            break;

        case 5:
            alert("Pão na chapa - R$ 6,00");
            break;

        default:
            alert("Código inválido");
    }
</script>
