<script>
    var idade = parseInt(prompt("Digite a idade do aluno:"));

    switch(idade){
        case 6:
            alert("Categoria: Dente de leite");
            break;

        case 7:
            alert("Categoria: Júnior");
            break;

        case 8:
            alert("Categoria: Júnior max");
            break;

        case 9:
            alert("Categoria: Júnior master");
            break;

        case 10:
            alert("Categoria: Master");
            break;

        default:
            alert("Idade não permitida");
    }
</script>
