<script>
    var idade = parseInt(prompt("Entre com a idade do aluno:"));
    if (idade <= 10){
        document.write("Categoria: Dente de Leite");
    } else if (idade <= 14){
        document.write("Categoria: Sub Juvenil");
    } else if (idade <= 16){
        document.write("Categoria: Juvenil");
    } else if (idade <= 20){
        document.write("Categoria: Aspirante");
    } else {
        document.write("Categoria: Profissional");
    }
</script>
