<script>
    var salario = parseFloat(prompt("Entre com o salário:"));
    var salarioMinimo = parseFloat(prompt("Entre com o salário mínimo:"));
    if (salario >= salarioMinimo) {
        document.write("Salário dentro da lei");
    } else {
        document.write("Salário abaixo do salário mínimo");
    }
</script>
