<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeros pares</title>
</head>
<body>

    <h1> Números pares de 0 a 200</h1>

    <script>
        for (let Número = 0; Número <= 200;  Número +=2) {
            document.write  (Número + "<br>" );
        }
    </script>
</body>
</html>
