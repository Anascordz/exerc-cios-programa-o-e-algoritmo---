<!DOCTYPE html>
<html>
<head>
    <title>Fatorial</title>
</head>
<body>

<script>

let ni;
let fat = 1;

ni = Number(prompt("Digite um número inteiro:"));

while (ni > 1) {

    fat = fat * ni;
    ni = ni - 1;

}

document.write("O fatorial é: " + fat);

</script>

</body>
</html>
