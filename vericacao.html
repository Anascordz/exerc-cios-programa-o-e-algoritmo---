        ];

            let idade = anoAtual - anoNascimento;

                "Usuário " + (usuario + 1) +
                " nasceu em " + anoNascimento +
                " e tem " + idade + " anos. "
            );

                document.write("É MAIOR de idade.<br>");
            } else {
                document.write("É MENOR de idade.<br>");
            }
        }
    </script>

</body>
</html>
