<!DOCTYPE html>
<html>
<head>
    <title>Altura de Joao e Pedro</title>
</head>
<body>

<script>

let joao = 134;
let pedro = 145;
let anos = 0;

while (joao <= pedro) {

    joao = joao + 2.5;
    pedro = pedro + 2;
    anos = anos + 1;

}

document.write("Joao ficara mais alto que Pedro em " + anos + " anos.");

</script>

</body>
</html>
